services:
  web:
    build: .
    ports:
      - "3000:80"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Defaults to development for local use; CI sets RAILS_ENV=production explicitly.
      RAILS_ENV: ${RAILS_ENV:-development}
      RAILS_LOG_TO_STDOUT: "true"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
