# Overcommit hook configuration.
# Run `bundle exec overcommit --install` to activate these hooks.
# Run `bundle exec overcommit --sign` after editing this file.
# See https://github.com/sds/overcommit for full documentation.

gemfile: Gemfile

PreCommit:
  RuboCop:
    enabled: true
    on_warn: fail
    command: ["bundle", "exec", "rubocop"]
